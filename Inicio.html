<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cancionero</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .contenedor {
            width: 1024px;
            height: auto; 
            border: 2px solid black;
            margin: 20px auto;
            display: grid;
            grid-template-columns: 724px 300px; 
            grid-template-rows: 90px 50px 568px 60px; 
        }

        .box {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            color: #970000;
            border: 1px solid #333;
        }

        .header {
            grid-column: span 2;
            background-color: hwb(0 0% 0%);       
        }

        .canciones-titulo {
            color: rgb(255, 255, 255); 
            font-size: 100px;  
            font-family: arial, sans-serif;
        }

        .nav {
            grid-column: span 2;
            background-color: rgb(51, 51, 51);  
        }

        .nav ul {
            list-style: none;
            display: flex;          
            gap: 12px;              
        }

        .nav a {
            display: block;
            background-color: rgb(255, 196, 0);
            text-decoration: none;
            text-align: center;
            color: rgb(0, 0, 0);
            width: 120px;
            height: 40px;
            line-height: 40px;
            border-radius: 5px;
            font-family: Arial, sans-serif;
            font-size: 16px;
        }

        .nav a:hover {
            background-color: rgb(173, 4, 4);
        }

        .section {
            background-color: rgb(250, 237, 49);
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding: 14px;
            font-size: 16px;
            font-weight: normal;
            font-family: Arial, Helvetica, sans-serif;
            height: 568px;
        }

        .section h2, .section h3{
            font-weight: bold;
            color: #ff0000;
            margin-bottom: 10px;
            text-align:center;
           
        
        }

        .section h3{
            margin-top: 20px;
        }

        .section ul{
            margin-left: 20px;
        }

        .aside {
            background-color: rgb(167, 167, 167);
            display: flex;
            flex-direction: column;
            justify-content:center;
            align-items: center;
            padding: 30px 20px;
            font-size: 16px;
           height: 568px;
           overflow:hidden;
        }

        .imagen-aside {
            width: 100%;
            height: auto;
            margin-bottom:auto;
            
        }
 
        .imagen-section {
            width: 60%;
            max-height: 350px;
            object-fit: cover;
            display: block;
            margin: 20px auto;
            border-radius: 8px;
        }
        .bloque-info{
            margin-bottom: 15px;
        }

        .bloque-info strong{
            display: block;
            font-weight: bold;
            margin-bottom: 3px;
        }
.footer{
        grid-column: span 2;
        color: rgb(255, 255, 255);
        background-color:rgb(122, 0, 0);
        grid-row: 4;
        display: flex;
        justify-content: center;
        align-items: center;
        }


    </style>
</head> 
<body>

<div class="contenedor">
        
<div class="box header"> 
 <span class="canciones-titulo">CANCIONES</span> 
</div>
 <div class="box nav"> 
 <nav>
<ul>
<li><a href="thriller.html">Thriller</a></li>
 <li><a href="Never Gonna Give You Up.html">Never Gonna Give You Up</a></li>
<li><a href="Noa Noa.html">Noa Noa</a></li>
<li><a href="Vuelve.html">Vuelve</a></li>
<li><a href="Lose My mind.html">Lose My mind</a></li>
</ul>
</nav> </div>
<div class="section" style="border: 1px solid #000000;">

<img src="imagenes/musica.jpg" alt="Imagen de música" class="imagen section">
   

</div>
<div class="box aside">
    <img src="imagenes/samsung.jpg" alt="Imagen de Samsung" class="imagen-aside">
</div>

<div class="box footer">
     <span>Emilio Alamilla</span>    
</div>

</div> </body>

</html>
